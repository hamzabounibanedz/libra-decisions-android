<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#482b36"><title>Evenhand · Decision journal</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/globals.css"><link rel="stylesheet" href="/workspace.css"></head>
<body><header class="mast"><a class="brand" href="/" aria-label="Evenhand home"><img src="/logo.png" alt="">Evenhand</a><a class="install" href="/install">Get Android <span aria-hidden="true">↗</span></a></header>
<main><h1>Decision journal</h1><section class="spread"><label for="question">The question</label><input id="question" maxlength="150" placeholder="What are you deciding?"><div class="balance"><span id="score">Even</span><meter id="meter" value=".5" min="0" max="1" aria-label="Share of weight in favor"></meter></div><div class="ledger"><section><h2>In favor</h2><ul id="yes"></ul></section><section><h2>Against</h2><ul id="no"></ul></section></div></section>
<form id="reason" class="composer"><label>Argument<input id="argument" required maxlength="180" placeholder="Write one reason"></label><label>Side<select id="side"><option value="yes">In favor</option><option value="no">Against</option></select></label><label>Weight<select id="weight"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><button class="action">Add argument</button></form>
</main><footer><span>Evenhand</span><div><a href="https://github.com/hamzabounibanedz/libra-decisions-android">Source</a><a href="https://github.com/hamzabounibanedz/libra-decisions-android/releases/latest">Android releases</a><a href="/FONT-LICENSE.txt">Font license</a></div></footer><p id="message" role="status" aria-live="polite"></p><script type="module" src="/workspace.js"></script></body></html>
